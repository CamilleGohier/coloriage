<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Pixel Art Multijoueur</title>
    <style>
        #grid {
            display: grid;
            grid-template-columns: repeat(16, 20px);
            grid-template-rows: repeat(16, 20px);
            gap: 1px;
            margin-top: 20px;
        }

        .pixel {
            width: 20px;
            height: 20px;
            background: white;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        #canvasCompressed {
            border: 1px solid #ccc;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <script src="./compression.js"></script>

    <h1>Pixel Art Multijoueur</h1>
    <input type="file" id="fileInput" name="filename" accept="image/*" onchange="handleFileUpload(this.files);">
    <label for="scaleInput">Réduction (%) :</label>
    <input type="number" id="scaleInput" value="50" min="1" max="100">
    <label for="scaleInput">Nb Colors :</label>
    <input type="number" id="colorInput" value="10" min="1" max="100">
    <div id="grid"></div>

    <canvas id="canvasOriginal" style="border:1px solid #ccc; display: none;"></canvas>
    <canvas id="canvasCompressed" style="border:1px solid #ccc;"></canvas>
</body>

</html>
